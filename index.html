<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>屏東勝利之家 - 膳工坊線上訂購系統</title>
    <!-- 引入 LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f7f9fa; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #2c3e50; font-size: 14px; }
        input[type="text"], input[type="tel"], input[type="date"], select, textarea {
            width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 8px; box-sizing: border-box; font-size: 15px; background-color: #fff;
        }
        .section-title { font-size: 16px; font-weight: bold; color: #2980b9; margin: 20px 0 10px 0; border-bottom: 2px solid #ecf0f1; padding-bottom: 5px; }
        .product-card { display: flex; flex-direction: column; padding: 12px; border: 1px solid #e9ecef; border-radius: 10px; margin-bottom: 10px; background: #fafbfc; }
        .product-main { display: flex; justify-content: space-between; align-items: center; }
        .product-info { flex-grow: 1; }
        .product-name { font-weight: bold; font-size: 15px; color: #34495e; }
        .product-price { color: #e67e22; font-size: 14px; margin-top: 2px; }
        .product-controls { display: flex; align-items: center; gap: 10px; }
        .qty-input { width: 60px; text-align: center; padding: 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        .flavor-select { margin-top: 8px; width: 100%; padding: 6px; border-radius: 6px; border: 1px solid #ddd; font-size: 14px; }
        .summary-box { background: #e8f4f8; padding: 15px; border-radius: 10px; margin-top: 20px; font-size: 15px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .summary-row span:first-child { font-weight: bold; color: #34495e; }
        .submit-btn { width: 100%; background-color: #06C755; color: white; border: none; padding: 14px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 20px; transition: background 0.2s; }
        .submit-btn:disabled { background-color: #adb5bd; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h2>膳工坊線上訂購</h2>
    <div class="subtitle">屏東勝利之家庇護工場</div>
    
    <form id="orderForm">
        <div class="form-group">
            <label for="customerName">訂購人姓名 *</label>
            <input type="text" id="customerName" required placeholder="請輸入真實姓名">
        </div>

        <div class="form-group">
            <label for="customerPhone">聯絡電話 *</label>
            <input type="tel" id="customerPhone" required placeholder="例如：0912345678">
        </div>

        <div class="form-group">
            <label for="deliveryMethod">配送方式 *</label>
            <select id="deliveryMethod" required>
                <option value="常溫宅配">常溫宅配 (常溫品未滿3000元運費180元)</option>
                <option value="冷凍宅配">冷凍宅配 (冷凍品未滿3500元運費290元)</option>
                <option value="勝利之家自取">勝利之家自取 (免運費，地址：屏東市)</option>
            </select>
        </div>

        <div class="form-group" id="addressGroup">
            <label for="customerAddress">收件地址 *</label>
            <input type="text" id="customerAddress" placeholder="請輸入完整收件地址（包含郵遞區號更好）">
        </div>

        <div class="form-group">
            <label for="dueDate">預定到貨/取貨日 *</label>
            <input type="date" id="dueDate" required>
        </div>

        <div class="form-group">
            <label for="pickupTime">希望時段 *</label>
            <select id="pickupTime">
                <option value="上午 (09:00~13:00)">上午 (09:00~13:00)</option>
                <option value="下午 (14:00~18:00)">下午 (14:00~18:00)</option>
                <option value="不指定">不指定</option>
            </select>
        </div>

        <div class="section-title">📦 選購商品專區</div>
        <div id="productList">
            <!-- 常溫品 1：南棗核桃糕 -->
            <div class="product-card" data-cat="normal" data-price="550">
                <div class="product-main">
                    <div class="product-info">
                        <div class="product-name">南棗核桃糕 (300g)</div>
                        <div class="product-price">$550 / 包</div>
                    </div>
                    <div class="product-controls">
                        <input type="number" class="qty-input" min="0" value="0" data-name="南棗核桃糕 (300g)" data-price="550" data-cat="normal">
                    </div>
                </div>
            </div>

            <!-- 常溫品 2：手工蛋捲禮盒 -->
            <div class="product-card" data-cat="normal" data-price="320">
                <div class="product-main">
                    <div class="product-info">
                        <div class="product-name">挪威手工蛋捲禮盒</div>
                        <div class="product-price">$320 / 盒</div>
                    </div>
                    <div class="product-controls">
                        <input type="number" class="qty-input" min="0" value="0" data-name="挪威手工蛋捲禮盒" data-price="320" data-cat="normal">
                    </div>
                </div>
                <select class="flavor-select">
                    <option value="綜合口味">口味：綜合口味</option>
                    <option value="原味">口味：原味</option>
                    <option value="芝麻">口味：芝麻</option>
                </select>
            </div>

            <!-- 常溫品 3：香橙檸檬磅蛋糕 -->
            <div class="product-card" data-cat="normal" data-price="350">
                <div class="product-main">
                    <div class="product-info">
                        <div class="product-name">香橙檸檬磅蛋糕</div>
                        <div class="product-price">$350 / 條</div>
                    </div>
                    <div class="product-controls">
                        <input type="number" class="qty-input" min="0" value="0" data-name="香橙檸檬磅蛋糕" data-price="350" data-cat="normal">
                    </div>
                </div>
            </div>

            <!-- 冷凍品 1：燻雞乳酪厚片 -->
            <div class="product-card" data-cat="cold" data-price="290">
                <div class="product-main">
                    <div class="product-info">
                        <div class="product-name">燻雞乳酪厚片</div>
                        <div class="product-price">$290 / 份</div>
                    </div>
                    <div class="product-controls">
                        <input type="number" class="qty-input" min="0" value="0" data-name="燻雞乳酪厚片" data-price="290" data-cat="cold">
                    </div>
                </div>
            </div>
        </div>

        <div class="summary-box">
            <div class="summary-row"><span>商品小計：</span><span id="subtotalText">$0</span></div>
            <div class="summary-row"><span>運費：</span><span id="shippingText">$0</span></div>
            <div class="summary-row" style="font-size: 18px; color: #c0392b; margin-top: 8px; border-top: 1px dashed #bcdff1; padding-top: 8px;">
                <span>總金額：</span><span id="grandTotalText">$0</span>
            </div>
        </div>

        <div class="form-group" style="margin-top: 15px;">
            <label for="note">備註說明</label>
            <textarea id="note" rows="2" placeholder="如有特殊需求或送禮說明請在此註明"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">確認送出訂單</button>
    </form>
</div>

<script>
    var lineUserId = "";

    window.addEventListener('DOMContentLoaded', function() {
        setupCalculator();
        initLiffSafely();
        setupDeliveryToggle();
        setMinDate();
    });

    function setMinDate() {
        var today = new Date().toISOString().split('T')[0];
        document.getElementById('dueDate').setAttribute('min', today);
    }

    function setupDeliveryToggle() {
        var deliverySelect = document.getElementById('deliveryMethod');
        var addressGroup = document.getElementById('addressGroup');
        var addressInput = document.getElementById('customerAddress');

        function toggleAddress() {
            if (deliverySelect.value === '勝利之家自取') {
                addressGroup.style.display = 'none';
                addressInput.removeAttribute('required');
                addressInput.value = '';
            } else {
                addressGroup.style.display = 'block';
                addressInput.setAttribute('required', 'required');
            }
            updateSummary();
        }

        deliverySelect.addEventListener('change', toggleAddress);
        toggleAddress();
    }

    function initLiffSafely() {
        if (typeof liff === 'undefined') return;
        liff.init({ liffId: "2012378128-9Jj8Pq95" })
            .then(function() {
                if (liff.isInClient()) {
                    liff.getProfile().then(function(profile) {
                        window.lineUserId = profile.userId;
                    }).catch(function(err) {
                        console.log("取得 Profile 失敗", err);
                    });
                }
            })
            .catch(function(err) {
                console.log("LIFF 初始化失敗", err);
            });
    }

    function setupCalculator() {
        var qtyInputs = document.querySelectorAll('.qty-input');
        var deliverySelect = document.getElementById('deliveryMethod');

        qtyInputs.forEach(function(input) {
            input.addEventListener('input', updateSummary);
            input.addEventListener('change', updateSummary);
            input.addEventListener('keyup', updateSummary);
        });

        if (deliverySelect) {
            deliverySelect.addEventListener('change', updateSummary);
        }
        updateSummary();
    }

    function updateSummary() {
        var normalTotal = 0;
        var coldTotal = 0;

        document.querySelectorAll('.product-card').forEach(function(card) {
            var input = card.querySelector('.qty-input');
            if (input) {
                var qty = parseInt(input.value) || 0;
                var price = parseInt(input.getAttribute('data-price')) || 0;
                var cat = card.getAttribute('data-cat');

                if (qty > 0) {
                    if (cat === 'normal') {
                        normalTotal += qty * price;
                    } else if (cat === 'cold') {
                        coldTotal += qty * price;
                    }
                }
            }
        });

        var subtotal = normalTotal + coldTotal;
        var deliveryMethod = document.getElementById('deliveryMethod').value;
        var shippingFee = 0;

        if (deliveryMethod === '常溫宅配') {
            if (normalTotal > 0 && normalTotal < 3000) {
                shippingFee = 180;
            } else {
                shippingFee = 0;
            }
        } else if (deliveryMethod === '冷凍宅配') {
            if (coldTotal > 0 && coldTotal < 3500) {
                shippingFee = 290;
            } else {
                shippingFee = 0;
            }
        } else if (deliveryMethod === '勝利之家自取') {
            shippingFee = 0;
        }

        var grandTotal = subtotal + shippingFee;

        document.getElementById('subtotalText').innerText = '$' + subtotal;
        document.getElementById('shippingText').innerText = '$' + shippingFee;
        document.getElementById('grandTotalText').innerText = '$' + grandTotal;
    }

    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "訂單傳送中...";

        var orderItems = [];
        var subtotal = 0, normalTotal = 0, coldTotal = 0;

        document.querySelectorAll('.product-card').forEach(function(card) {
            var input = card.querySelector('.qty-input');
            if (input) {
                var qty = parseInt(input.value) || 0;
                if (qty > 0) {
                    var baseName = input.getAttribute('data-name');
                    var price = parseInt(input.getAttribute('data-price')) || 0;
                    var cat = card.getAttribute('data-cat');
                    
                    var flavorSelect = card.querySelector('.flavor-select');
                    var itemName = baseName;
                    if (flavorSelect) {
                        itemName += " (" + flavorSelect.value + ")";
                    }

                    var itemSubtotal = qty * price;
                    orderItems.push({ name: itemName, quantity: qty, subtotal: itemSubtotal });

                    subtotal += itemSubtotal;
                    if (cat === 'normal') normalTotal += itemSubtotal;
                    if (cat === 'cold') coldTotal += itemSubtotal;
                }
            }
        });

        if (orderItems.length === 0) {
            alert("請至少選擇一項商品！");
            btn.disabled = false;
            btn.innerText = "確認送出訂單";
            return;
        }

        var deliveryMethod = document.getElementById('deliveryMethod').value;
        var shippingAddress = (deliveryMethod === '勝利之家自取') ? '勝利之家自取（無須寄送）' : document.getElementById('customerAddress').value;
        var shippingFee = 0;
        if (deliveryMethod === '常溫宅配' && normalTotal < 3000 && normalTotal > 0) shippingFee = 180;
        if (deliveryMethod === '冷凍宅配' && coldTotal < 3500 && coldTotal > 0) shippingFee = 290;
        var totalAmount = subtotal + shippingFee;

        var itemsText = orderItems.map(function(item) {
            return item.name + " x " + item.quantity + " ($" + item.subtotal + ")";
        }).join("；");
        
        var formData = {
            userId: window.lineUserId || "",
            name: document.getElementById('customerName').value,
            phone: document.getElementById('customerPhone').value,
            deliveryMethod: deliveryMethod,
            address: shippingAddress,
            dueDate: document.getElementById('dueDate').value + " (" + document.getElementById('pickupTime').value + ")",
            items: itemsText,
            subtotal: "$" + subtotal,
            shippingFee: "$" + shippingFee,
            totalAmount: "$" + totalAmount,
            note: document.getElementById('note').value || '無'
        };

        var scriptURL = "https://script.google.com/macros/s/AKfycbz-ssiRwKCPeHlB-1Myju0cKHF8iQyHDv_cvTREPugGldpCAfm2Z31L3YQdrKRukf6DbA/exec";

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(function(response) {
            try {
                if (typeof liff !== 'undefined' && liff.isInClient()) {
                    var msg = "📝 【膳工坊】訂單已成功送出！\n\n" +
                              "👤 訂購人：" + formData.name + "\n" +
                              "📞 電話：" + formData.phone + "\n" +
                              "🚚 配送方式：" + formData.deliveryMethod + "\n" +
                              "📅 預定到期日：" + formData.dueDate + "\n" +
                              "🛍️ 訂購品項：" + formData.items + "\n" +
                              "💰 總金額：" + formData.totalAmount + "\n\n" +
                              "感謝您的訂購，我們會盡快為您處理！";

                    liff.sendMessages([{ type: 'text', text: msg }]).catch(function(e) {
                        console.log("LIFF 發送訊息略過:", e);
                    });
                }
            } catch (err) {
                console.log("LIFF 異常略過:", err);
            }

            alert("🎉 訂單已成功送出！感謝您的訂購，我們會盡快為您處理。");
            document.getElementById('orderForm').reset();
            btn.disabled = false;
            btn.innerText = "確認送出訂單";
            setupDeliveryToggle();
            updateSummary();
        })
        .catch(function(error) {
            alert("🎉 訂單已順利送出！");
            document.getElementById('orderForm').reset();
            btn.disabled = false;
            btn.innerText = "確認送出訂單";
            setupDeliveryToggle();
            updateSummary();
        });
    });
</script>

</body>
</html>
